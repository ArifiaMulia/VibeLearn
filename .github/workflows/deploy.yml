name: Deploy to K3s

on:
  push:
    branches: [main, virtuenet]
  workflow_dispatch:

concurrency:
  group: k3s-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  provision-backend:
    name: Provision PostgreSQL & Backend Secrets
    runs-on: [self-hosted, in-cluster, k3s]
    timeout-minutes: 10
    steps:
      - name: Ensure PostgreSQL & vibelearn-api-secret in K3s
        run: |
          set -euo pipefail
          NAMESPACE="${{ github.ref == 'refs/heads/main' && 'vibelearn-prod' || 'vibelearn-dev' }}"

          echo "🔍 Ensuring namespace $NAMESPACE..."
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace "$NAMESPACE" app.kubernetes.io/part-of=virtuenet --overwrite

          echo "🔐 Ensuring secret vibelearn-api-secret in $NAMESPACE..."
          if ! kubectl -n "$NAMESPACE" get secret vibelearn-api-secret >/dev/null 2>&1; then
            LARK_SEC=$(kubectl -n secure-prod get secret secure-secrets -o jsonpath='{.data.LARK_APP_SECRET}' 2>/dev/null | base64 -d || echo "")
            BYTE_SEC=$(kubectl -n secure-prod get secret secure-secrets -o jsonpath='{.data.BYTEPLUS_API_KEY}' 2>/dev/null | base64 -d || echo "")
            kubectl -n "$NAMESPACE" create secret generic vibelearn-api-secret \
              --from-literal=DATABASE_URL="postgres://vibelearn_user:vibelearn_pass@vibelearn-db:5432/vibelearn_db" \
              --from-literal=JWT_SECRET="vibelearn_super_secret_jwt_2026" \
              --from-literal=NODE_ENV="production" \
              --from-literal=PORT="3000" \
              --from-literal=LARK_APP_ID="cli_a9c0eaefaa78deee" \
              --from-literal=LARK_APP_SECRET="${LARK_SEC}" \
              --from-literal=BYTEPLUS_API_KEY="${BYTE_SEC}"
          fi

          echo "🗄️ Ensuring PostgreSQL 15 (vibelearn-db) in $NAMESPACE..."
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: vibelearn-db
            namespace: $NAMESPACE
            labels:
              app: vibelearn-db
              app.kubernetes.io/part-of: virtuenet
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: vibelearn-db
            template:
              metadata:
                labels:
                  app: vibelearn-db
              spec:
                nodeSelector:
                  kubernetes.io/hostname: vn-core-prod-02
                volumes:
                - name: pgdata-vol
                  hostPath:
                    path: /srv/vibe-${NAMESPACE}-pgdata
                    type: DirectoryOrCreate
                containers:
                - name: postgres
                  image: postgres:15-alpine
                  ports:
                  - containerPort: 5432
                  env:
                  - name: POSTGRES_DB
                    value: "vibelearn_db"
                  - name: POSTGRES_USER
                    value: "vibelearn_user"
                  - name: POSTGRES_PASSWORD
                    value: "vibelearn_pass"
                  - name: PGDATA
                    value: "/var/lib/postgresql/data/pgdata"
                  volumeMounts:
                  - name: pgdata-vol
                    mountPath: /var/lib/postgresql/data
                  readinessProbe:
                    exec:
                      command: ["sh", "-c", "pg_isready -U vibelearn_user -d vibelearn_db"]
                    initialDelaySeconds: 5
                    periodSeconds: 5
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      cpu: 500m
                      memory: 512Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: vibelearn-db
            namespace: $NAMESPACE
            labels:
              app: vibelearn-db
          spec:
            ports:
            - port: 5432
              targetPort: 5432
            selector:
              app: vibelearn-db
          EOF

          echo "⏳ Waiting for vibelearn-db to be ready..."
          kubectl -n "$NAMESPACE" rollout status deployment/vibelearn-db --timeout=120s

  deploy-api:
    name: K3s API Deploy
    needs: provision-backend
    uses: virtuenet-prasetia/.github/.github/workflows/k3s-app-deploy.yml@main
    with:
      app_name: vibelearn-api
      target_namespace: ${{ github.ref == 'refs/heads/main' && 'vibelearn-prod' || 'vibelearn-dev' }}
      target_deployment: vibelearn-api
      target_service: vibelearn-api
      port: 3000
      health_endpoint: /api/health
      dockerfile: api/Dockerfile
      context: ./api
      replicas: 1
    secrets: inherit

  ensure-api-port:
    name: Ensure API Service Port 3000
    needs: deploy-api
    runs-on: [self-hosted, in-cluster, k3s]
    steps:
      - name: Expose Port 3000 on vibelearn-api Service
        run: |
          set -euo pipefail
          NAMESPACE="${{ github.ref == 'refs/heads/main' && 'vibelearn-prod' || 'vibelearn-dev' }}"
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Service
          metadata:
            name: vibelearn-api
            namespace: $NAMESPACE
            labels:
              app: vibelearn-api
          spec:
            type: ClusterIP
            ports:
            - port: 80
              targetPort: 3000
              name: http
            - port: 3000
              targetPort: 3000
              name: api
            selector:
              app: vibelearn-api
          EOF

  deploy-frontend:
    name: K3s Frontend Deploy
    needs: ensure-api-port
    uses: virtuenet-prasetia/.github/.github/workflows/k3s-app-deploy.yml@main
    with:
      app_name: vibelearn
      target_namespace: ${{ github.ref == 'refs/heads/main' && 'vibelearn-prod' || 'vibelearn-dev' }}
      target_deployment: vibelearn
      target_service: vibelearn
      port: 80
      health_endpoint: /
      ingress_host: ${{ github.ref == 'refs/heads/main' && 'vibe.virtuenet.space' || '' }}
    secrets: inherit

  ensure-ingress-routing:
    name: Ensure Production Ingress Routing
    if: github.ref == 'refs/heads/main'
    needs: deploy-frontend
    runs-on: [self-hosted, in-cluster, k3s]
    steps:
      - name: Inspect and Ensure Ingress Points to vibelearn-prod & Verify All Endpoints
        run: |
          set -euo pipefail
          echo "🔍 Current Ingresses matching vibe:"
          kubectl get ingress -A -o wide | grep -i vibe || true

          echo "🔍 Ensuring vibelearn-prod pods are scaled up and ready:"
          kubectl -n vibelearn-prod scale deployment/vibelearn-db --replicas=1
          kubectl -n vibelearn-prod scale deployment/vibelearn-api --replicas=1
          kubectl -n vibelearn-prod scale deployment/vibelearn --replicas=1
          kubectl -n vibelearn-prod rollout status deployment/vibelearn-api --timeout=60s
          kubectl -n vibelearn-prod rollout status deployment/vibelearn --timeout=60s
          sleep 3

          echo "🧪 Running In-Cluster E2E Module & Upload Verification..."
          API_URL="http://vibelearn.vibelearn-prod.svc.cluster.local"
          curl -fsS --retry 5 --retry-delay 2 --retry-connrefused "${API_URL}/api/health" | head -c 300 && echo ""
          curl -fsS --retry 5 --retry-delay 2 --retry-connrefused "${API_URL}/api/config" | head -c 300 && echo ""
          curl -fsS --retry 5 --retry-delay 2 --retry-connrefused "${API_URL}/manifest.json" | head -c 300 && echo ""
          curl -fsS -I --retry 5 --retry-delay 2 --retry-connrefused "${API_URL}/icon-512.png" | head -n 5
          curl -fsS -I --retry 5 --retry-delay 2 --retry-connrefused "${API_URL}/icon-512-maskable.png" | head -n 5
          curl -fsS -I --retry 5 --retry-delay 2 --retry-connrefused "${API_URL}/uploads/images/1793776302191-658592852.png" | head -n 5
          curl -fsS -I --retry 5 --retry-delay 2 --retry-connrefused "${API_URL}/uploads/images/1793776549788-625074971.png" | head -n 5

          echo "🧪 Testing Full API & Upload Persistence via vibelearn-api..."
          kubectl -n vibelearn-prod exec deployment/vibelearn-api -- node -e "
          (async () => {
            const base = 'http://vibelearn.vibelearn-prod.svc.cluster.local';
            const check = async (name, url, opts = {}) => {
              const res = await fetch(base + url, opts);
              if (res.status >= 400) throw new Error(name + ' failed with ' + res.status);
              console.log('✅', name, res.status, res.headers.get('content-type'));
              return res;
            };
            await check('Health', '/api/health');
            await check('Public Config', '/api/config');
            await check('Fallback Logo 1', '/uploads/images/1793776302191-658592852.png');
            await check('Fallback Logo 2', '/uploads/images/1793776549788-625074971.png');

            const loginRes = await fetch(base + '/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: 'admin@vibelearn.id', password: 'Admin@2026!' })
            });
            const loginData = await loginRes.json();
            if (!loginRes.ok) throw new Error('Login failed');
            console.log('✅ Admin Login:', loginData.user.email);
            const headers = { 'Authorization': 'Bearer ' + loginData.token, 'Content-Type': 'application/json' };

            await check('Auth Me', '/api/auth/me', { headers });
            await check('Courses', '/api/courses', { headers });
            await check('Labs', '/api/labs', { headers });
            await check('Users', '/api/users', { headers });
            await check('Leaderboard', '/api/users/leaderboard', { headers });
            await check('Progress Me', '/api/progress/me', { headers });
            await check('Progress Recent', '/api/progress/recent', { headers });
            await check('Analytics Overview', '/api/analytics/overview', { headers });
            await check('Subscription Plans', '/api/subscriptions/plans', { headers });
            await check('Subscription Verifications', '/api/subscriptions/verifications', { headers });
            await check('Subscription Settings', '/api/subscriptions/settings', { headers });
            await check('System Settings', '/api/settings', { headers });
            await check('AI Settings', '/api/settings/ai', { headers });
            await check('AI Models', '/api/ai/models', { headers });
            await check('Certificate Verify', '/api/certificates/verify/CERT-1-1');

            const fs = require('fs');
            const pngBytes = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==', 'base64');
            const form = new FormData();
            form.append('file', new Blob([pngBytes], { type: 'image/png' }), 'test-logo.png');
            const upRes = await fetch(base + '/api/upload', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + loginData.token },
              body: form
            });
            const upData = await upRes.json();
            if (!upRes.ok) throw new Error('Upload failed: ' + JSON.stringify(upData));
            console.log('✅ Upload POST /api/upload ->', upData.url);
            await check('Fetch Uploaded Image via Nginx ' + upData.url, upData.url);
          })();
          "
