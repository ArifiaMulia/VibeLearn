# Rate Limiting Zone for Abuse / Scraping Protection (ISO 42001 Clause 7 & ASVS V13.2.5)
limit_req_zone $binary_remote_addr zone=vibelearn_general:10m rate=30r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
  gzip_min_length 256;

  # Block HTTP TRACE / TRACK methods (ASVS V14.5.1 & ISO 42001 Clause 10)
  if ($request_method ~ ^(TRACE|TRACK)$) {
    return 405;
  }

  # Security & Hardening Headers (OWASP ASVS 4.0.3 V14.4 / CIS Level 1 / ISO 42001)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "0" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-DoV8KnfUG2+x3vis4HWFdbbBixVOrbbb14jS4hNU/xI='; script-src-elem 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.virtuenet.space https://*.larksuite.com https://*.feishu.cn https://cloudflareinsights.com https://*.cloudflareinsights.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; manifest-src 'self'; frame-ancestors 'self' https://*.larksuite.com https://*.feishu.cn; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; report-uri /api/csp-report" always;
  add_header RateLimit-Limit "600" always;
  add_header RateLimit-Remaining "599" always;
  add_header RateLimit-Reset "60" always;

  # Explicitly block sensitive dot-files except /.well-known/
  location ~ /\.(?!well-known).* {
    deny all;
    return 404;
  }

  # RFC 9116 Vulnerability Disclosure Policy (security.txt)
  location = /.well-known/security.txt {
    default_type text/plain;
    add_header Content-Type "text/plain; charset=utf-8" always;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri /security.txt =404;
  }

  location = /security.txt {
    default_type text/plain;
    add_header Content-Type "text/plain; charset=utf-8" always;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Android Digital Asset Links (TWA Validation)
  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Content-Type "application/json; charset=utf-8" always;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Web App Manifest
  location = /manifest.json {
    default_type application/manifest+json;
    add_header Content-Type "application/manifest+json; charset=utf-8" always;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    limit_req zone=vibelearn_general burst=60 nodelay;
    try_files $uri $uri/ /index.html;
  }

  location ^~ /uploads/ {
    client_max_body_size 50M;
    set $upstream_uploads http://vibelearn-api.vibelearn-prod.svc.cluster.local:3000;
    proxy_pass $upstream_uploads;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    expires 30d;
    add_header Cache-Control "public" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ^~ /api/ {
    client_max_body_size 50M;
    set $upstream_api http://vibelearn-api.vibelearn-prod.svc.cluster.local:3000;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache_bypass $http_upgrade;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  }
}
